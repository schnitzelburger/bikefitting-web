<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikefit Analyse</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: auto; }
        .worker-status { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem .75rem; border-radius: 999px; font-size: .9rem; margin-bottom: 1rem; }
        .worker-status.online { color: #166534; background: #dcfce7; }
        .worker-status.offline { color: #991b1b; background: #fee2e2; }
        .worker-status.checking { color: #854d0e; background: #fef9c3; }
        .status-dot { width: .65rem; height: .65rem; border-radius: 50%; background: currentColor; }
        #analysestatus { margin-top: 1rem; }
        .analyse-status-text { margin-bottom: .5rem; }
        .analyse-progress { width: 100%; height: 1rem; accent-color: #166534; }
        #ladeanzeige { display: none; color: #666; margin-top: 1rem; }
        .htmx-request #ladeanzeige { display: block; }
        .htmx-request button { display: none; }
    </style>
</head>
<body>
    <div id="worker-status" class="worker-status checking"
         hx-get="/worker-status" hx-trigger="load, every 10s" hx-swap="outerHTML">
        <span class="status-dot"></span>
        <span>Worker wird geprüft...</span>
    </div>
    <h1>Rennrad Sitzposition messen</h1>
    <p>Lade dein Video von der Seite hoch.</p>
    
    <form hx-post="/upload" hx-encoding="multipart/form-data" hx-target="#ergebnis">
        <p>
            <label>Oberschenkel in mm:</label><br>
            <input type="number" name="oberschenkel" value="450" required>
        </p>
        <p>
            <label>Unterschenkel in mm:</label><br>
            <input type="number" name="unterschenkel" value="475" required>
        </p>
        <p>
            <input type="file" name="video" accept="video/*" required>
        </p>
        <button type="submit">Video analysieren</button>
        <div id="ladeanzeige">
            <p>Bitte warten. Die Analyse laeuft und kann ein paar Minuten dauern.</p>
        </div>
    </form>
    
    <div id="ergebnis" style="margin-top: 2rem;"></div>
</body>
</html>
